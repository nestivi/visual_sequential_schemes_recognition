[project]
name = "vssr"
version = "0.1.0"
description = "Visual Sequential Schemes Recognition"
authors = [
    { name = "Martin Krawiec, Jan Woliński, Tobiasz Jóźwiak" }
]
readme = "README.md"
requires-python = ">=3.10, <3.11"

dependencies = [
    "opencv-python>=4.7.0",
    "mediapipe>=0.10.1",
    "numpy>=1.24.0"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["vssr*"]
