[project]
name = "vssr"
version = "0.1.0"
description = "Visual Sequential Schemes Recognition"
authors = [
    { name = "Martin Krawiec, Jan Woliński, Tobiasz Jóźwiak" }
]

requires-python = ">=3.10"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
